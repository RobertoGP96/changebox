# Servidor de Changebox que trae el APK de fábrica: quien lo instala solo pone
# correo y contraseña. Si se deja vacía, la app pide la URL en el login
# (lo que quieres en desarrollo, para apuntar al Next.js de tu LAN).
changebox.serverUrl=

# Servidor de Neon Auth del proyecto (consola de Neon → Auth). NO es secreta
# (equivale a la URL de un endpoint público de login); a diferencia de la
# cadena de conexión, sí puede viajar compilada en el APK.
changebox.neonAuthUrl=https://ep-dark-moon-aeazylbr.neonauth.c-2.us-east-2.aws.neon.tech/neondb/auth

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
